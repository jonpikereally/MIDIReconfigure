name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build universal app
        env:
          MIDI_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-app.sh --universal
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MIDI-Reconfigure.zip \
            --title "MIDI Reconfigure ${GITHUB_REF_NAME#v}" --generate-notes
