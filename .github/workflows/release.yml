name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 1.3.0. Leave empty to use the version in Packaging/Info.plist."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(plutil -extract CFBundleShortVersionString raw Packaging/Info.plist)"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::REL-001 '$version' isn't a version like 1.3.0."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" ]] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::REL-002 v$version already exists. Bump CFBundleShortVersionString or enter a new version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build universal app
        env:
          MIDI_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh --universal

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # On a manual run this also creates the v<version> tag at the commit that was built.
          gh release create "v$VERSION" dist/MIDI-Reconfigure.zip \
            --target "$GITHUB_SHA" --title "MIDI Reconfigure $VERSION" --generate-notes
